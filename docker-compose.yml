# ══════════════════════════════════════════════════════════════════════
#  Ecommerce Microservices Platform — Docker Compose
#
#  This file GROWS INCREMENTALLY — each datastore/broker arrives with its
#  first consuming service (D-01):
#    • Phase 2 adds postgres:18 + auth-service ONLY
#    • Phase 3 adds MongoDB        (catalog-service)
#    • Phase 4 adds Redis          (cart-service)
#    • Phase 5 adds Kafka KRaft    (order-service + payment-service)
#    • Phase 6 adds Mailpit        (notification-service)
#    • Phases 7–8 add the gateway and frontend services
#    • Phase 9 completes healthcheck/memory/smoke wiring so
#      `docker compose up` runs the entire system
#
#  Environment: values come from .env (copy from .env.example).
# ══════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # D-02 honored literally: ONLY the users database is created now; the
      # orders database is added by order-service in Phase 5, NOT pre-created.
      # PHASE 5 OBLIGATION (research Pitfall 8): /docker-entrypoint-initdb.d
      # scripts execute solely during FIRST initialization of an empty data
      # volume. Phase 5 must therefore ship BOTH an init-script backfill AND a
      # one-time CREATE DATABASE so long-lived volumes also get orders.
      POSTGRES_DB: users
    volumes:
      # PG18 layout: mount the ROOT path (the declared VOLUME). Mounting the
      # old /var/lib/postgresql/data suffix silently misplaces data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d users"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NO host ports published — the datastore stays network-internal
    # (GTWY-04 direction).

  auth-service:
    build: ./services/auth-service
    # TRANSITIONAL HOST PORT — direct :8081 access exists for Phases 2–6 only;
    # revoked in Phase 7 as part of GTWY-04 isolation verification (D-09).
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS}
      SERVER_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Phase 3: MongoDB 8.0 (products collection) ──────────────────────────
  mongo:
    image: mongo:8.0
    # NO host ports published — datastore stays network-internal (GTWY-04).
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Phase 3: Catalog Service (FastAPI + PyMongo) ────────────────────────
  catalog-service:
    build: ./services/catalog-service
    # TRANSITIONAL HOST PORT — direct :8000 access for Phases 3–6 only;
    # revoked in Phase 7 as part of GTWY-04 isolation verification (D-09).
    mem_limit: 512m
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS}
      MONGO_URI: ${MONGO_URI}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Phase 4: Redis 8 (cart datastore) ──────────────────────────────────
  redis:
    image: redis:8-alpine
    # NO host port published — datastore stays network-internal (GTWY-04).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Phase 4: Cart Service (Express 5 + ioredis) ────────────────────────
  cart-service:
    build: ./services/cart-service
    # TRANSITIONAL HOST PORT — direct :3001 access for Phases 4–6 only;
    # revoked in Phase 7 as part of GTWY-04 isolation verification (D-09).
    mem_limit: 256m
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS}
      REDIS_URL: redis://redis:6379/0
      CATALOG_URL: http://catalog-service:8000
      CART_TTL_SECONDS: ${CART_TTL_SECONDS}
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      # BusyBox wget (alpine) — grep the literal "ok" from /health.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health | grep ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Phase 5: Apache Kafka 4.2.1 (KRaft, NO ZooKeeper) ───────────────────
  kafka:
    image: apache/kafka:4.2.1
    # TRANSITIONAL HOST PORT — direct :9092 access for Phases 5–6 only;
    # the broker stays network-internal after Phase 7 hardening.
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Provision order.created + payment.completed (3 partitions, RF=1) — contract
  # mandates fixed partitions/RF and NO auto-create (docs/kafka-topics.md).
  kafka-init:
    image: apache/kafka:4.2.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      sh -c "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.created --partitions 3 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.completed --partitions 3 --replication-factor 1"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 1

  # Create the orders database once (idempotent; safe on long-lived volumes).
  orders-db-init:
    image: postgres:18
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      sh -c "psql -h postgres -U $$POSTGRES_USER -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='orders'\" | grep -q 1 || psql -h postgres -U $$POSTGRES_USER -d postgres -c \"CREATE DATABASE orders\""
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 1

  # Read-only topic/consumer-group observability for the ORDR-08 kill test.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ── Phase 5: Order Service (Spring Boot 3.5.16) ─────────────────────────
  order-service:
    build: ./services/order-service
    # TRANSITIONAL HOST PORT — direct :8082 access for Phases 5–6 only;
    # revoked in Phase 7 (deviation A5, recorded in DOCS-02).
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS}
      SERVER_PORT: "8082"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CART_SERVICE_URL: http://cart-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      orders-db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      cart-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Phase 5: Payment Service (FastAPI 0.141.1, Kafka saga participant) ──
  payment-service:
    build: ./services/payment-service
    # TRANSITIONAL HOST PORT — direct :8083 access for Phases 5–6 only;
    # revoked in Phase 7 (deviation A5, recorded in DOCS-02).
    mem_limit: 512m
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      PAYMENT_MODE: ${PAYMENT_MODE:-always_success}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[u]vicorn'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Phase 6: Mailpit (SMTP mock) ────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 1000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Phase 6: Notification Service (Node.js/kafkajs worker) ──────────────
  notification-service:
    build: ./services/notification-service
    mem_limit: 256m
    environment:
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[n]ode src/index.js' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Phase 7: API Gateway (Spring Cloud Gateway) ─────────────────────────
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    mem_limit: 512m
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  mongo-data:
  redis-data:
  kafka-data:


