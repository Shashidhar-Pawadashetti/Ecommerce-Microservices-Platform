[project]
name = "payment-service"
version = "1.0.0"
description = "Payment Service — FastAPI Kafka saga participant (mock authorization)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "PyJWT==2.13.0",
    "aiokafka==0.14.0",
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "testcontainers==4.15.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
