server:
  port: 8081

spring:
  datasource:
    # Compose injects SPRING_DATASOURCE_URL (jdbc:postgresql://postgres:5432/users);
    # the localhost default serves host-driven runs (e.g. Testcontainers-free local boot).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/users}
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    # Flyway owns schema evolution; validate catches entity/migration drift early.
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

jwt:
  # Names are contractual (.env.example): JWT_SECRET/JWT_ISSUER/JWT_AUDIENCE/
  # JWT_TTL_SECONDS via relaxed binding; compose injects the real values from
  # .env. The base64 default decodes to a 37-byte DEV/TEST-ONLY placeholder so
  # host-driven runs boot without env setup — compose always overrides it and
  # JwtSecretAssertion enforces >=32 decoded bytes either way.
  secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktc2lnbmluZy1zZWNyZXQtMzJieXRlcw==}
  issuer: ${JWT_ISSUER:ecommerce-auth}
  audience: ${JWT_AUDIENCE:ecommerce-api}
  ttl-seconds: ${JWT_TTL_SECONDS:3600}
