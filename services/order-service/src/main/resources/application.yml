server:
  port: 8082

spring:
  datasource:
    # Compose injects SPRING_DATASOURCE_URL (jdbc:postgresql://postgres:5432/orders);
    # the localhost default serves host-driven runs.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    # Flyway owns schema evolution; validate catches entity/migration drift early.
    hibernate:
      ddl-auto: validate
  kafka:
    # RESEARCH Pattern 1 — property names map 1:1 to Kafka client config.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      enable-auto-commit: false          # RECORD ackMode => at-least-once
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

jwt:
  # Names are contractual (.env.example): JWT_SECRET/JWT_ISSUER/JWT_AUDIENCE/
  # JWT_TTL_SECONDS via relaxed binding; compose injects the real values from
  # .env. The base64 default decodes to a 37-byte DEV/TEST-ONLY placeholder so
  # host-driven runs boot without env setup.
  secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktc2lnbmluZy1zZWNyZXQtMzJieXRlcw==}
  issuer: ${JWT_ISSUER:ecommerce-auth}
  audience: ${JWT_AUDIENCE:ecommerce-api}
  ttl-seconds: ${JWT_TTL_SECONDS:3600}

app:
  cart-service-url: ${CART_SERVICE_URL:http://cart-service:3001}
