[project]
name = "catalog-service"
version = "1.0.0"
description = "Catalog Service — FastAPI product catalog backed by MongoDB 8.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pymongo>=4.9",
    "PyJWT==2.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "testcontainers==4.15.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
